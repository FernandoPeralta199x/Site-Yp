<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="YP Cloud">
  <title>YP Cloud</title>
  <defs>
    <radialGradient id="ypFundo" cx="36%" cy="30%" r="80%">
      <stop offset="0%"   stop-color="#1C2647"/>
      <stop offset="55%"  stop-color="#111A2E"/>
      <stop offset="100%" stop-color="#070A12"/>
    </radialGradient>
  </defs>

  <circle cx="60" cy="60" r="60" fill="url(#ypFundo)"/>

  <g transform="translate(4,0) skewX(-8)">
    <!-- Y: dois braços que convergem e uma haste -->
    <g fill="none" stroke="#FFFFFF" stroke-width="13">
      <path d="M23 36 L44 64"/>
      <path d="M64 36 L46 62"/>
      <path d="M44 64 L44 86"/>
    </g>

    <!-- Detalhe azul: a lasca na base da haste do Y -->
    <path d="M37.5 72 h13 v14 l-13 6 Z" fill="#2F7CF6"/>

    <!-- P: haste vertical e bojo -->
    <path d="M69 86 V36 h13 a15 15 0 0 1 0 30 h-13"
          fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linejoin="miter"/>
  </g>
</svg>
